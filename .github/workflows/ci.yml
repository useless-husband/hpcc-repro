name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: build
        run: cargo build --release
      - name: tests (unit, validation, behaviour, golden digest)
        run: cargo test --release
      - name: quick experiment set
        run: make quick
      - uses: actions/upload-artifact@v4
        with:
          name: quick-results
          path: |
            results/quick/index.html
            results/quick/numbers.json
            results/quick/figures/
