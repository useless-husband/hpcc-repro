[package]
name = "hpcc-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Packet-level datacenter network simulator reproducing the HPCC (SIGCOMM 2019) evaluation"
publish = false

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"

# Integration tests run real simulations; build them optimised.
[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true
